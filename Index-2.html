<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ยอดขายมือถือประจำวัน</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f2f5f7;--card:#fff;--ink:#14202b;--mute:#667785;--line:#dbe3e9;--acc:#0b7a66;--acc-ink:#fff;--hi:#e6f4f0;--warn:#b4531a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161c;--card:#18222b;--ink:#e8eef2;--mute:#8da0ae;--line:#2a3846;--acc:#34c3a5;--acc-ink:#06201a;--hi:#183530;--warn:#f0a066}}
:root[data-theme="dark"]{--bg:#0f161c;--card:#18222b;--ink:#e8eef2;--mute:#8da0ae;--line:#2a3846;--acc:#34c3a5;--acc-ink:#06201a;--hi:#183530;--warn:#f0a066}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans Thai",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:14px}
h1{font-size:22px;font-weight:800;margin:4px 0 2px}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
input,button,select{font:inherit;color:inherit}
input[type=text],input[type=date],input[type=search]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sum b{display:block;font-size:20px}
.sum span{color:var(--mute);font-size:12px}
.sh{font-weight:800;font-size:14px;margin:10px 0 6px}
.sh.ip{color:var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.tbl{overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:13px}
td:first-child,th:first-child{overflow-wrap:anywhere;line-height:1.3}
col.cp{width:19%}col.cq{width:11%}col.cm{width:22%}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--card)}
td.n,th.n{text-align:right;white-space:nowrap}
tr.has td{background:var(--hi)}
.qty{width:64px;text-align:center;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--bg)}
.pr{width:92px;text-align:right}
.brand{color:var(--mute);font-size:12px}
.msg{color:var(--warn);font-size:13px;min-height:18px;margin:4px 0;overflow-wrap:anywhere}
.empty{padding:28px;text-align:center;color:var(--mute)}
.sellers{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sellers h2{font-size:15px;margin:0 0 6px}
.sellers div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)}
.add{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:8px;margin-bottom:10px}
.add input[type=text]{flex:1}
.add .q2{width:64px;text-align:center}
.plus{width:44px;font-size:22px;line-height:1;padding:6px}
.tabs{display:flex;gap:6px;margin:6px 0 10px}
.tabs .btn{flex:1}
.grp{margin-bottom:12px}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 12px;background:var(--hi);border:1px solid var(--line);border-radius:10px 10px 0 0;font-weight:700}
.gh span{font-weight:400;color:var(--mute);font-size:13px}
.grp .tbl{border-radius:0 0 10px 10px;border-top:0}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:16px;line-height:1}
.step b{min-width:22px;text-align:center}
.mw{position:relative;flex:1;min-width:0}
.mw input{width:100%}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:300px;overflow-y:auto;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.sug button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;cursor:pointer}
.sug button:last-child{border-bottom:0}
.sug button:hover,.sug button.on{background:var(--hi)}
.sug small{display:block;color:var(--mute);font-size:12px}
.man{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.man[hidden]{display:none}
.man .r{display:flex;gap:8px}
.man input{flex:1;min-width:0}
.mt{background:none;border:0;color:var(--acc);font-weight:600;cursor:pointer;padding:0 0 8px;font-size:13px}
.sug .none button{display:inline;width:auto;border:0;padding:0;color:var(--acc);font-weight:700;text-decoration:underline}
.sug .none{padding:10px 12px;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>ยอดขายมือถือประจำวัน</h1>
  <p class="sub">พิมพ์ชื่อรุ่น แล้วกด + เพื่อเพิ่มยอดขาย ทุกคนเห็นยอดรวมเดียวกัน</p>
  <div class="bar">
    <input type="date" id="date" aria-label="วันที่">
    <input type="text" id="seller" placeholder="ชื่อผู้กรอก / สาขา" maxlength="40" aria-label="ชื่อผู้กรอก">
    <button class="btn ghost" id="upBtn">อัปโหลดไฟล์ Excel</button>
    <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
  </div>
  <div class="add">
    <div class="mw"><input type="text" id="model" placeholder="พิมพ์ชื่อรุ่นบางส่วน เช่น iphone 15 128" autocomplete="off" aria-label="ชื่อรุ่น"><div class="sug" id="sug" hidden></div></div>
    <input type="number" id="addq" class="qty q2" value="1" min="1" inputmode="numeric" aria-label="จำนวน">
    <button class="btn plus" id="addBtn" aria-label="เพิ่มยอดขาย">+</button>
  </div>
  <button type="button" class="mt" id="manT">+ ไม่พบรุ่น? กรอกรุ่นและยอดขายเอง</button>
  <div class="man" id="man" hidden>
    <div class="r">
      <input type="text" id="mName" placeholder="ชื่อรุ่น เช่น Samsung A07 (4+128)" maxlength="80" aria-label="ชื่อรุ่นที่กรอกเอง">
    </div>
    <div class="r">
      <input type="number" id="mPrice" placeholder="ราคา (บาท)" min="0" inputmode="numeric" aria-label="ราคา">
      <button class="btn plus" id="mAdd" type="button" aria-label="เพิ่มยอดขายที่กรอกเอง">+</button>
    </div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="tabs"><button class="btn" id="tDay">รายวัน</button><button class="btn ghost" id="tMonth">ทั้งเดือน</button></div>
  <div class="bar" id="monthBar" hidden><input type="month" id="month" aria-label="เดือน" style="padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:8px"></div>
  <div class="sh">ยอดขาย Smartphone</div>
  <div class="sum">
    <div><b id="sUnits">0</b><span id="lUnits">เครื่องที่ขายวันนี้</span></div>
    <div><b id="sMoney">0</b><span id="lMoney">ยอดขายรวม (บาท)</span></div>
  </div>
  <div class="sh ip">ยอดขาย iPhone</div>
  <div class="sum">
    <div><b id="iUnits">0</b><span id="liUnits">เครื่องที่ขายวันนี้</span></div>
    <div><b id="iMoney">0</b><span id="liMoney">ยอดขายรวม (บาท)</span></div>
  </div>
  <div class="sum" id="mStrip" style="grid-template-columns:1fr"><div style="grid-column:1/-1;background:var(--hi)"><span>ยอดขายสะสมทั้งเดือนนี้ (อัปเดตทันที)</span><b id="mTotal">0 เครื่อง · 0 บาท</b></div></div>
  <div class="chips" id="chips"></div>
  <div id="groups"></div>
  <div class="empty" id="empty" hidden></div>
  <div class="sellers" id="sellers" hidden><h2>ชื่อผู้กรอกยอด</h2><div id="sellerList" style="display:block"></div></div>
</div>
<script>
// ===== ตั้งค่า Supabase (Project Settings > API) =====
const CFG={url:'https://zthdbpuupbgrspdjrxqa.supabase.co',key:'sb_publishable_-9jCJAKX73tmvbq9KJUmvA_fCPSWWBf'};
// =====================================================
const $=id=>document.getElementById(id);
let db=null,uid='local',catalog=[],sales=[],msales=[],unsub2=null,brand='ทั้งหมด',unsub=null,mode='day';
const mine={};
const fmt=n=>Number(n||0).toLocaleString('th-TH');
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)};
const say=t=>{$('msg').textContent=t||''};
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const t=new Date(),p2=n=>String(n).padStart(2,'0');
$('date').value=`${t.getFullYear()}-${p2(t.getMonth()+1)}-${p2(t.getDate())}`;
$('month').value=$('date').value.slice(0,7);
$('seller').value=ls('ps_seller')||'';
$('seller').onchange=()=>ls('ps_seller',$('seller').value.trim());

$('upBtn').onclick=()=>$('file').click();
const ALN={name:['name','ชื่อสินค้า','ชื่อ','ชื่อรุ่น','product name'],price:['set price','ราคา','price','ราคาขาย'],brand:['brand','แบรนด์','ยี่ห้อ'],model:['model','รุ่น']};
const lc=v=>String(v==null?'':v).trim().toLowerCase();
// ชื่อรุ่นไม่เอาสี: ใช้คอลัมน์ Model (ไม่มีสี) + เติมความจุจาก Name ถ้า Model ไม่มี
const SPEC=/\d+\s*(gb|tb)|\d+\s*\+\s*\d+/i;
function cleanName(name,model){
  let m=String(model||'').replace(/\s+/g,' ').trim();
  if(!m)return name.replace(/\s+/g,' ').trim();
  if(!SPEC.test(m)){const x=name.match(/\b\d+\s*(?:GB|TB)\b/i)||name.match(/\d+\s*\+\s*\d+/);if(x)m+=' '+x[0].replace(/\s+/g,'')}
  return m;
}
function readSheet(ws,sheetName){
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  let hr=-1,ci=-1,pi=-1,bi=-1,mi=-1;
  for(let r=0;r<Math.min(rows.length,15);r++){
    const h=rows[r].map(lc);
    const n=h.findIndex(x=>ALN.name.includes(x)),p=h.findIndex(x=>ALN.price.includes(x));
    if(n>=0&&p>=0){hr=r;ci=n;pi=p;bi=h.findIndex(x=>ALN.brand.includes(x));mi=h.findIndex(x=>ALN.model.includes(x));break}
  }
  if(hr<0)return null;
  const out=[];
  for(let r=hr+1;r<rows.length;r++){
    const row=rows[r],raw=String(row[ci]||'').trim();if(!raw)continue;
    const n=cleanName(raw,mi>=0?row[mi]:'');
    const p=Number(String(row[pi]).replace(/,/g,''))||0;
    const b=(bi>=0&&String(row[bi]).trim())?String(row[bi]).trim().toUpperCase():sheetName.trim().toUpperCase();
    out.push({n,p,b,c:sheetName});
  }
  return out;
}
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const map=new Map(),rep=[],skip=[];
    for(const name of wb.SheetNames){
      const items=readSheet(wb.Sheets[name],name);
      if(!items){skip.push(name);continue}
      let add=0;items.forEach(i=>{const k=i.n.toLowerCase();if(!map.has(k)){map.set(k,i);add++}});
      rep.push(`${name} ${add} รุ่น`);
    }
    const items=[...map.values()].sort((a,b)=>a.b.localeCompare(b.b)||a.n.localeCompare(b.n));
    if(!items.length){say('ไม่พบหัวคอลัมน์ Name / Set Price ในทุกชีตของไฟล์');return}
    catalog=items;render();
    const info=`อ่าน ${rep.length} ชีต: ${rep.join(' · ')}`+(skip.length?` (ข้ามชีตที่ไม่มีคอลัมน์ Name/Set Price: ${skip.join(', ')})`:'');
    if(db){const{error}=await db.from('catalog').upsert({id:'main',items,updated_at:new Date().toISOString()});if(error)throw error;say(info+' — อัปเดตให้ทุกคนแล้ว')}
    else say(info+' (ไม่ได้แชร์ให้คนอื่น)');
  }catch(err){say('อ่านไฟล์ไม่สำเร็จ: '+(err.message||err))}
  e.target.value='';
};
function fillList(){}
let picked=null,hi=0,cur=[];
const norm=x=>x.toLowerCase().replace(/[^a-z0-9ก-๙+]+/g,' ').trim();
function suggest(txt){
  const toks=norm(txt).split(' ').filter(Boolean);if(!toks.length)return [];
  const sc=catalog.map(i=>{
    const n=norm(i.n),nc=n.replace(/ /g,'');let hit=0;
    toks.forEach(t=>{if(n.includes(t)||nc.includes(t))hit++});
    const full=hit===toks.length;
    return {i,full,hit,pos:full?Math.min(...toks.map(t=>{const p=n.indexOf(t);return p<0?99:p})):99};
  }).filter(x=>x.hit>0);
  sc.sort((a,b)=>(b.full-a.full)||(b.hit-a.hit)||(a.pos-b.pos)||a.i.n.length-b.i.n.length);
  return sc.slice(0,10).map(x=>({...x.i,near:!x.full}));
}
function showSug(){
  const box=$('sug'),txt=$('model').value;picked=null;
  if(!txt.trim()){box.hidden=true;return}
  cur=suggest(txt);hi=0;box.innerHTML='';
  if(!cur.length){const d=document.createElement('div');d.className='none';d.append('ไม่พบรุ่นที่ใกล้เคียง · ');const mb=document.createElement('button');mb.type='button';mb.textContent='กรอกเอง';mb.onmousedown=e=>e.preventDefault();mb.onclick=()=>openMan(txt.trim());d.appendChild(mb);box.appendChild(d);box.hidden=false;return}
  const nearFrom=cur.findIndex(x=>x.near);
  cur.forEach((it,idx)=>{
    if(idx===nearFrom){const d=document.createElement('div');d.className='none';d.textContent='รุ่นที่ใกล้เคียง';box.appendChild(d)}
    const bt=document.createElement('button');bt.type='button';if(idx===hi)bt.className='on';
    bt.innerHTML='<span></span><small></small>';bt.children[0].textContent=it.n;bt.children[1].textContent=`${it.b}${it.c?' · '+it.c:''} · ${fmt(it.p)} บาท`;
    bt.onmousedown=e=>e.preventDefault();
    bt.onclick=()=>choose(it);box.appendChild(bt);
  });
  box.hidden=false;
}
function choose(it){picked=it;$('model').value=it.n;$('sug').hidden=true;$('addq').focus();$('addq').select()}
async function addFromInput(){
  let r=picked;
  if(!r){const q=$('model').value.trim().toLowerCase();r=catalog.find(i=>i.n.toLowerCase()===q)||null;
    if(!r){const m=suggest(q).filter(x=>!x.near);if(m.length===1)r=m[0]}}
  if(!r){showSug();say('เลือกรุ่นจากรายการที่แสดง แล้วกด +');return}
  const n=Math.max(1,Math.floor(Number($('addq').value)||1));
  if(await change(r,n)){say(`เพิ่ม ${r.n} +${n}`);$('model').value='';$('addq').value=1;picked=null;$('sug').hidden=true;$('model').focus()}
}
$('addBtn').onclick=addFromInput;
function openMan(name){
  $('man').hidden=false;$('sug').hidden=true;
  if(name)$('mName').value=name;
  (name?$('mPrice'):$('mName')).focus();
}
$('manT').onclick=()=>{if($('man').hidden)openMan($('model').value.trim());else $('man').hidden=true};
function guessBrand(name){
  if(/iphone/i.test(name))return 'iPhone';
  const w=name.split(' ')[0].toLowerCase();
  const ex=catalog.map(i=>i.b).find(b=>b&&b.toLowerCase()===w);
  return ex||(w.length>1?w.charAt(0).toUpperCase()+w.slice(1):'อื่นๆ');
}
async function addManual(){
  const name=$('mName').value.replace(/\s+/g,' ').trim(),price=Math.round(Number($('mPrice').value));
  if(!name){say('กรุณาใส่ชื่อรุ่น');$('mName').focus();return}
  if($('mPrice').value===''||!(price>=0)){say('กรุณาใส่ราคา');$('mPrice').focus();return}
  const item={n:name,p:price,b:guessBrand(name),k:hash('manual|'+name.toLowerCase()+'|'+price)};
  if(await change(item,1)){say(`เพิ่ม ${name} +1 (กรอกเอง)`);$('mName').value='';$('mPrice').value='';$('man').hidden=true;$('model').value=''}
}
$('mAdd').onclick=addManual;
['mName','mPrice'].forEach(id=>$(id).onkeydown=e=>{if(e.key==='Enter')addManual()});
$('model').oninput=showSug;
$('model').onfocus=()=>{if($('model').value.trim()&&!picked)showSug()};
$('model').onblur=()=>setTimeout(()=>{$('sug').hidden=true},150);
$('model').onkeydown=e=>{
  const bs=[...$('sug').querySelectorAll('button')];
  if(e.key==='ArrowDown'&&bs.length){e.preventDefault();hi=Math.min(bs.length-1,hi+1)}
  else if(e.key==='ArrowUp'&&bs.length){e.preventDefault();hi=Math.max(0,hi-1)}
  else if(e.key==='Enter'){e.preventDefault();if(!picked&&bs.length&&!$('sug').hidden&&cur.length){choose(cur[hi]);return}addFromInput();return}
  else return;
  bs.forEach((b,i)=>b.className=i===hi?'on':'');bs[hi]&&bs[hi].scrollIntoView({block:'nearest'});
};
$('addq').onkeydown=e=>{if(e.key==='Enter')addFromInput()};

async function change(item,delta){
  const date=$('date').value,seller=$('seller').value.trim();
  if(!seller){say('กรุณาใส่ชื่อผู้กรอกก่อน');$('seller').focus();return false}
  ls('ps_seller',seller);
  const key=item.k||hash(item.n),qty=Math.max(0,(mine[key]?.qty||0)+delta);
  const row={date,uid,seller,key,name:item.n,price:item.p,b:item.b,qty,ts:Date.now()};
  const same=s=>s.uid===uid&&s.key===key&&s.date===date;
  sales=sales.filter(s=>!same(s));msales=msales.filter(s=>!same(s));
  if(qty>0){sales.push(row);mine[key]=row;if(date.slice(0,7)===$('month').value)msales.push(row)}else delete mine[key];
  render();
  if(!db){say('บันทึกในเครื่องเท่านั้น (ยังไม่ได้เชื่อมต่อระบบแชร์)');return true}
  try{const id=`${date}__${uid}__${key}`;const{error}=qty>0?await db.from('sales').upsert({id,...row}):await db.from('sales').delete().eq('id',id);if(error)throw error;return true}
  catch(e){say('บันทึกไม่สำเร็จ: '+(e.message||'ตรวจสอบ policy ของตาราง'));return false}
}

// ---- render grouped by brand ----
function render(){
  const isDay=mode==='day';const D=isDay?sales:msales;
  {const MU=msales.reduce((a,s)=>a+s.qty,0),MM=msales.reduce((a,s)=>a+s.qty*s.price,0);$('mTotal').textContent=`${fmt(MU)} เครื่อง · ${fmt(MM)} บาท`;$('mStrip').hidden=!isDay}
  const agg={};
  D.forEach(s=>{const k=s.key,o=agg[k]||(agg[k]={name:s.name,price:s.price,b:s.b||(catalog.find(i=>hash(i.n)===k)||{}).b||'อื่นๆ',q:0,m:0});o.q+=s.qty;o.m+=s.qty*s.price});
  const all=Object.keys(agg).map(k=>({k,...agg[k]}));
  const brands=['ทั้งหมด',...[...new Set(all.map(a=>a.b))].sort()];
  if(!brands.includes(brand))brand='ทั้งหมด';
  $('chips').innerHTML='';
  brands.forEach(b=>{const c=document.createElement('button');c.className='chip'+(b===brand?' on':'');c.textContent=b;c.onclick=()=>{brand=b;render()};$('chips').appendChild(c)});
  const G=$('groups');G.innerHTML='';
  const names=brands.slice(1).filter(b=>brand==='ทั้งหมด'||b===brand);
  names.forEach(b=>{
    const rows=all.filter(a=>a.b===b).sort((x,y)=>y.m-x.m);
    const U=rows.reduce((a,r)=>a+r.q,0),M=rows.reduce((a,r)=>a+r.m,0);
    const g=document.createElement('div');g.className='grp';
    g.innerHTML='<div class="gh"><div></div><span></span></div><div class="tbl"><table><colgroup><col><col class="cp"><col class="cq"><col class="cm"></colgroup><thead><tr><th>รุ่น</th><th class="n">ราคา</th><th class="n">จำนวน</th><th class="n">เป็นเงิน</th></tr></thead><tbody></tbody></table></div>';
    g.querySelector('.gh div').textContent=b;
    g.querySelector('.gh span').textContent=`${fmt(U)} เครื่อง · ${fmt(M)} บาท`;
    const tb=g.querySelector('tbody');
    rows.forEach(r=>{
      const tr=document.createElement('tr');
      const td=(c)=>{const d=document.createElement('td');if(c)d.className=c;tr.appendChild(d);return d};
      td().textContent=r.name;td('n').textContent=fmt(r.price);
      const qc=td('n');
      if(isDay){
        const my=mine[r.k]?.qty||0;
        qc.textContent=r.q;
        if(my&&r.q>my){const s2=document.createElement('div');s2.className='brand';s2.textContent=`ของฉัน ${my} / รวม ${r.q}`;qc.appendChild(s2)}
      }else qc.textContent=fmt(r.q);
      td('n').textContent=fmt(r.m);
      tb.appendChild(tr);
    });
    G.appendChild(g);
  });
  const isIP=a=>/iphone/i.test(a.name+' '+a.b),isPad=a=>/ipad/i.test(a.name+' '+a.b);
  const ip=all.filter(isIP),sp=all.filter(a=>!isIP(a)&&!isPad(a));
  const sm=(arr,u,m)=>{$(u).textContent=fmt(arr.reduce((a,r)=>a+r.q,0));$(m).textContent=fmt(arr.reduce((a,r)=>a+r.m,0))};
  sm(sp,'sUnits','sMoney');sm(ip,'iUnits','iMoney');
  const lu=isDay?'เครื่องที่ขายวันนี้':'เครื่องที่ขายทั้งเดือน',lm=isDay?'ยอดขายรวม (บาท)':'ยอดขายรวมทั้งเดือน (บาท)';
  $('lUnits').textContent=lu;$('liUnits').textContent=lu;$('lMoney').textContent=lm;$('liMoney').textContent=lm;
  const e=$('empty');e.hidden=all.length>0;e.textContent=isDay?'ยังไม่มียอดขายวันนี้ — พิมพ์ชื่อรุ่นด้านบนแล้วกด +':'เดือนนี้ยังไม่มียอดขาย';
  const by={};D.forEach(s=>{const o=by[s.uid]||(by[s.uid]={name:s.seller||'ไม่ระบุชื่อ',q:0,m:0});if(s.seller)o.name=s.seller;o.q+=s.qty;o.m+=s.qty*s.price});
  const arr=Object.values(by).sort((a,b)=>b.m-a.m);$('sellers').hidden=!arr.length;
  $('sellerList').innerHTML='';arr.forEach(o=>{const d=document.createElement('div');const a=document.createElement('span');a.textContent=o.name;const b=document.createElement('span');b.textContent=`${fmt(o.q)} เครื่อง · ${fmt(o.m)} บาท`;d.append(a,b);$('sellerList').appendChild(d)});
}

// ---- subscribe (day + month always live) ----
let rt=0;
async function refetch(){
  if(!db)return;const tk=++rt,d=$('date').value,m=$('month').value;
  const [a,b]=await Promise.all([db.from('sales').select('*').eq('date',d),db.from('sales').select('*').gte('date',m+'-01').lte('date',m+'-31')]);
  if(tk!==rt)return;
  if(a.error||b.error){say('โหลดยอดขายไม่สำเร็จ: '+(a.error||b.error).message);return}
  sales=a.data;msales=b.data;
  Object.keys(mine).forEach(k=>delete mine[k]);sales.forEach(s=>{if(s.uid===uid)mine[s.key]=s});render();
}
function watch(){Object.keys(mine).forEach(k=>delete mine[k]);sales=[];msales=[];render();refetch()}
async function loadCatalog(){
  const{data,error}=await db.from('catalog').select('items').eq('id','main').maybeSingle();
  if(error){say('โหลดรายการสินค้าไม่สำเร็จ: '+error.message);return}
  if(data&&data.items){catalog=data.items;render()}
}
function setMode(m){
  mode=m;$('tDay').className='btn'+(m==='day'?'':' ghost');$('tMonth').className='btn'+(m==='month'?'':' ghost');
  $('monthBar').hidden=m!=='month';render();
}
$('tDay').onclick=()=>setMode('day');$('tMonth').onclick=()=>setMode('month');
$('date').onchange=()=>{$('month').value=$('date').value.slice(0,7);watch()};
$('month').onchange=watch;

(async()=>{
  render();
  uid=ls('ps_uid')||('u'+Math.random().toString(36).slice(2,10));ls('ps_uid',uid);
  if(!CFG.url||CFG.url.startsWith('YOUR')){say('ยังไม่ได้ตั้งค่า Supabase — ใส่ URL และ anon key ที่หัวสคริปต์ (CFG)');return}
  try{db=supabase.createClient(CFG.url,CFG.key)}catch(e){say('เชื่อมต่อ Supabase ไม่สำเร็จ: '+e.message);return}
  await loadCatalog();
  let tm;db.channel('ps-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'sales'},()=>{clearTimeout(tm);tm=setTimeout(refetch,150)})
    .on('postgres_changes',{event:'*',schema:'public',table:'catalog'},loadCatalog)
    .subscribe();
  watch();
})();
</script>
